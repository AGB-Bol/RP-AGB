server {
    listen 80;
    server_name localhost; # En producción aquí irá el dominio de la universidad o IP del VPS

    # 1. Todo el tráfico de la API va al backend (.NET)
    location /api/ {
        # Usamos el nombre del contenedor "backend" y su puerto interno 8080
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. El resto del tráfico va al frontend (React)
    location / {
        # Usamos el nombre del contenedor "frontend" y su puerto 3000
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Necesario para el Hot-Reload de React (WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}